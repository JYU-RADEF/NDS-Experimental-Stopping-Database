[project]
name = "nds-database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "numpy>=2.2.6",
    "pandas>=2.3.0",
    "periodictable>=2.0.2",
    "plotly>=6.1.2",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.2.3.250527",
    "pytest>=8.4.0",
]

[tool.setuptools.package-data]
nds_database = ["package_data/*.csv"]
